<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PBL Presentation | 2026</title>

<link rel="stylesheet" href="./index_files/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

body {
  background-color: #020617;
  color: #f8fafc;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

/* TIMER */
#timerContainer {
  background: #ffffff;
  color: #020617;
  border: 3px solid #3b82f6;
  box-shadow: 0 10px 40px rgba(0,0,0,0.8);
  z-index: 1000;
}

@keyframes flicker {
  0%,100% { background:#fff }
  50% { background:#fca5a5 }
}

.timer-warning {
  animation: flicker 1s infinite;
  border-color:#ef4444!important;
  color:#b91c1c!important;
}

.timer-stop {
  background:#991b1b!important;
  color:#fff!important;
  border-color:#f87171!important;
}
</style>
</head>

<body onload="startTimer()">

<!-- TIMER -->
<div id="timerContainer" class="fixed bottom-10 right-10 px-8 py-4 rounded-3xl flex items-center gap-4">
  <i id="timerIcon" class="fas fa-hourglass-start text-blue-600 text-2xl"></i>
  <span id="displayTime" class="text-4xl font-black font-mono">00:00</span>
</div>

<!-- CONTENT (UNCHANGED) -->
<main class="max-w-6xl mx-auto px-6 pt-48 pb-32">
  <section id="results" class="glass p-12 rounded-[3.5rem] border-t-4 border-blue-500">
    <h2 class="text-3xl font-black mb-12 text-center uppercase tracking-tight">
      Results & <span class="text-blue-500">Analysis</span>
    </h2>

    <div style="height:320px">
      <canvas id="resultsChart"></canvas>
    </div>
  </section>
</main>

<!-- TIMER SCRIPT -->
<script>
let sec = 0;
let timer;

function startTimer() {
  timer = setInterval(() => {
    sec++;

    const m = Math.floor(sec / 60);
    const s = sec % 60;

    document.getElementById("displayTime").innerText =
      `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

    if (sec >= 480 && sec < 600) {
      timerContainer.classList.add("timer-warning");
      timerIcon.classList.replace("fa-hourglass-start","fa-hourglass-half");
    }

    if (sec >= 600) {
      clearInterval(timer);
      displayTime.innerText = "10:00";
      timerContainer.classList.replace("timer-warning","timer-stop");
      timerIcon.classList.replace("fa-hourglass-half","fa-hourglass-end");
    }
  }, 1000);
}
</script>

<!-- CHART -->
<script>
const ctx = document.getElementById("resultsChart").getContext("2d");

new Chart(ctx, {
  type: "bar",
  data: {
    labels: [
      "LC – Logistic (Cal)",
      "LC – Random Forest",
      "CIBIL – Logistic",
      "CIBIL – Logistic (Bal)"
    ],
    datasets: [{
      data: [0.712, 0.705, 0.836, 0.836],
      backgroundColor: [
        "rgba(59,130,246,0.85)",
        "rgba(59,130,246,0.55)",
        "rgba(168,85,247,0.85)",
        "rgba(168,85,247,0.55)"
      ],
      borderRadius: 10
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      y: {
        min: 0.65,
        max: 0.9,
        title: { display: true, text: "ROC-AUC" }
      },
      x: { grid: { display: false } }
    }
  }
});
</script>

</body>
</html>
